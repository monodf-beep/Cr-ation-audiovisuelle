<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Le clocher</title>
    <!-- Montage Instagram tres simple, plan apres plan, sans voix ni texte (demande de Franck, 10/10/2026).
         Plans : panorama, eglise, clocher retravaille dans Higgsfield (Kling 3.0 Omni Edit) a partir
         d'un recadrage qui pousse vers l'horloge (tools/zoom.py). Son : l'ambiance de chaque rush. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17.993" data-width="1080" data-height="1920">
      <video id="v-panorama" src="assets/plans/panorama.mp4" muted playsinline data-start="0" data-duration="2.9" data-media-start="0" data-track-index="1"></video>
      <video id="v-eglise" src="assets/plans/eglise.mp4" muted playsinline data-start="2.9" data-duration="6.76" data-media-start="0" data-track-index="2"></video>
      <video id="v-clocher" src="assets/plans/clocher.mp4" muted playsinline data-start="9.66" data-duration="8.333" data-media-start="0" data-track-index="1"></video>
      <audio id="a-panorama" src="assets/plans/panorama.m4a" data-start="0" data-duration="2.9" data-track-index="10" data-volume="1"></audio>
      <audio id="a-eglise" src="assets/plans/eglise.m4a" data-start="2.9" data-duration="6.76" data-track-index="11" data-volume="1"></audio>
      <audio id="a-clocher" src="assets/plans/clocher-son.m4a" data-start="9.66" data-duration="8.333" data-track-index="10" data-volume="1"></audio>
      <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 17.993);
      window.__timelines["main"] = tl;
      </script>
    </div>
  </body>
</html>
