<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0E2240; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0E2240; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform-origin: 60% 45%; filter: saturate(0.72) contrast(1.06) brightness(0.86); }
      #s3 { filter: saturate(0.72) contrast(1.06) brightness(0.98); }
      #s4 { filter: saturate(0.72) contrast(1.08) brightness(0.95); }
      #grade { position: absolute; inset: 0; background: #18365E; mix-blend-mode: multiply; opacity: 0.38; z-index: 10; }
      #warm { position: absolute; inset: 0; background: radial-gradient(60% 70% at 72% 40%, rgba(242, 137, 111, 0.16), rgba(242, 137, 111, 0) 70%); mix-blend-mode: screen; z-index: 11; }
      #side { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14, 34, 64, 0.34) 0%, rgba(14, 34, 64, 0.16) 38%, rgba(14, 34, 64, 0) 62%); z-index: 12; }
      #vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 60% 45%, rgba(14, 34, 64, 0) 45%, rgba(14, 34, 64, 0.65) 100%); z-index: 13; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <video id="s1" class="clip shot" src="assets/conference.mp4" muted playsinline data-start="0" data-duration="4.6" data-media-start="0.2" data-track-index="0"></video>
      <video id="s2" class="clip shot" src="assets/notes.mp4" muted playsinline data-start="3.8" data-duration="4.6" data-media-start="0.3" data-track-index="1"></video>
      <video id="s3" class="clip shot" src="assets/frappe.mp4" muted playsinline data-start="7.6" data-duration="4.6" data-media-start="0.5" data-track-index="2"></video>
      <video id="s4" class="clip shot" src="assets/presse.mp4" muted playsinline data-start="11.4" data-duration="4.6" data-media-start="0.5" data-track-index="3"></video>
      <div id="grade"></div>
      <div id="warm"></div>
      <div id="side"></div>
      <div id="vig"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const shots = [["#s1", 0], ["#s2", 3.8], ["#s3", 7.6], ["#s4", 11.4]];
      shots.forEach(([id, t], i) => {
        const first = i === 0;
        const last = i === shots.length - 1;
        tl.fromTo(id, { opacity: first ? 0 : 0 }, { opacity: 1, duration: first ? 0.6 : 0.8, ease: "sine.inOut" }, t);
        tl.fromTo(id, { scale: 1.02, xPercent: i % 2 ? 1 : -1 }, { scale: 1.1, xPercent: i % 2 ? -1 : 1, duration: 4.6, ease: "none" }, t);
        if (last) tl.to(id, { opacity: 0, duration: 0.6, ease: "sine.inOut" }, t + 4.0);
      });
      tl.fromTo("#warm", { opacity: 0.6 }, { opacity: 1, duration: 8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
