    <script>
      const tl = gsap.timeline({ paused: true });

      // Titrage : sur-titre, titre revele par masque, sous-titre.
      tl.from(".eyebrow", { y: 12, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.from("#title", { yPercent: 110, duration: 0.8, ease: "power4.out" }, 0.35);
      tl.from(".sub", { y: 12, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.9);

      // Contours traces au crayon, la Savoie d'abord puis les voisins.
      const order = ["savoie", "aoste", "piemont", "nice"];
      order.forEach((id, i) => {
        document.querySelectorAll(".trace-" + id).forEach((path) => {
          const len = Math.ceil(path.getTotalLength());
          gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(path, { strokeDashoffset: 0, duration: i === 0 ? 1.6 : 1.2, ease: "power2.inOut" }, 1.3 + i * 0.55);
        });
        tl.from(".label-" + id, { opacity: 0, y: 6, duration: 0.5, ease: "power2.out" }, 2.6 + i * 0.55);
      });

      tl.from(".brand", { opacity: 0, duration: 0.6, ease: "power1.out" }, 5.2);
